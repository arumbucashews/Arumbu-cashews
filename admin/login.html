<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Arumbu Cashews</title>
<!-- Internal utility page — deliberately excluded from search results,
     matching the "do not show prominently" requirement for the whole
     admin area. -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="../images/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  /* Scoped to this page only — a minimal, self-contained admin
     screen rather than the full public header/nav/footer, since an
     admin login has no reason to invite public browsing around it. */
  body.admin-standalone {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ivory);
    padding: 2rem 1.5rem;
  }
  .admin-card {
    max-width: 420px;
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--border-ink);
    border-radius: var(--radius);
    padding: 2.6rem 2.2rem;
    text-align: center;
    box-shadow: 0 24px 60px rgba(27, 14, 6, 0.08);
  }
  .admin-card img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 1.2rem; }
  .admin-card .eyebrow { justify-content: center; margin-bottom: 0.6rem; }
  .admin-card h1 {
    font-size: 1.5rem;
    color: var(--ink);
    margin-bottom: 0.9rem;
  }
  .admin-status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--ivory-2);
    border: 1px solid var(--border-ink);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.76rem;
    color: var(--gold-ink);
    letter-spacing: 0.03em;
    margin-bottom: 1.6rem;
  }
  .admin-status::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--gold-ink);
  }
  .admin-status.is-checking::before { background: var(--ink-muted); }
  .admin-back {
    font-size: 0.85rem;
    color: var(--ink-muted);
    border-bottom: 1px solid transparent;
    transition: color var(--transition), border-color var(--transition);
  }
  .admin-back:hover { color: var(--gold-ink); border-color: var(--gold-ink); }

  /* Login form — reuses the site's existing .form-field / .btn-gold
     patterns so it doesn't introduce a second visual language. */
  .admin-login-form { text-align: left; margin-bottom: 1.4rem; }
  .admin-login-form .form-field { margin-bottom: 1.1rem; }
  .admin-login-form .btn-gold { width: 100%; justify-content: center; margin-top: 0.4rem; }
  .admin-login-form .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .admin-error {
    display: none;
    background: rgba(178, 44, 44, 0.08);
    border: 1px solid rgba(178, 44, 44, 0.35);
    color: #9a2b2b;
    border-radius: var(--radius);
    padding: 0.7rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1.1rem;
    text-align: left;
  }
  .admin-error.is-visible { display: block; }
</style>
</head>
<body class="page-light admin-standalone">

  <div class="admin-card">
    <img src="../images/arumbu-logo.png" alt="Arumbu Cashews">
    <p class="eyebrow">Arumbu Cashews</p>
    <h1>Admin Login</h1>

    <span class="admin-status is-checking" id="adminStatus">Checking session…</span>

    <div id="adminLoginArea" style="display:none;">
      <p id="adminError" class="admin-error"></p>

      <form class="admin-login-form" id="adminLoginForm">
        <div class="form-field">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" name="email" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-gold" id="adminLoginBtn">Log In</button>
      </form>
    </div>

    <a href="../index.html" class="admin-back">← Back to Arumbu Cashews</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-auth.js"></script>
  <script>
  (function () {
    var statusEl = document.getElementById('adminStatus');
    var loginArea = document.getElementById('adminLoginArea');
    var errorEl = document.getElementById('adminError');
    var form = document.getElementById('adminLoginForm');
    var loginBtn = document.getElementById('adminLoginBtn');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('is-visible');
    }
    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('is-visible');
    }
    function showLoginForm(statusText) {
      statusEl.textContent = statusText || 'Not signed in';
      statusEl.classList.remove('is-checking');
      loginArea.style.display = 'block';
    }

    // If already authenticated AND authorised, skip straight to the panel
    // (requirement 9). Otherwise show the login form, signing out any
    // authenticated-but-unauthorised session first.
    async function init() {
      try {
        var result = await window.ArumbuAdminAuth.getAuthorisedSession();
        if (result.session && result.profile) {
          window.location.replace('dashboard.html');
          return;
        }
        if (result.session && !result.profile) {
          await window.ArumbuAdminAuth.signOut();
          showLoginForm('Not signed in');
          showError('This account is not authorised for Admin access.');
          return;
        }
        showLoginForm('Not signed in');
        if (window.location.search.indexOf('denied=1') !== -1) {
          showError('This account is not authorised for Admin access.');
        }
      } catch (err) {
        showLoginForm('Not signed in');
        showError(err.message || 'Could not reach Supabase. Check admin/supabase-config.js.');
      }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in…';

      try {
        var client = window.ArumbuAdminAuth.getClient();
        var email = document.getElementById('adminEmail').value.trim();
        var password = document.getElementById('adminPassword').value;

        var signInRes = await client.auth.signInWithPassword({ email: email, password: password });
        if (signInRes.error) {
          showError('Invalid email or password.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
          return;
        }

        // Authenticated — now verify the authorised public.profiles row.
        var result = await window.ArumbuAdminAuth.getAuthorisedSession();
        if (!result.profile) {
          await window.ArumbuAdminAuth.signOut();
          showError('This account is not authorised for Admin access.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
          return;
        }

        window.location.replace('dashboard.html');
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });

    init();
  })();
  </script>

</body>
</html>
