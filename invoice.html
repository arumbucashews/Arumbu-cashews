<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice | Arumbu Cashews</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1B0E06; --muted:#6b5a4a; --line:#e4dccb; --gold:#D4A32C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.5 Inter, system-ui, sans-serif; }
  body.arumbu-invoice { background: url('images/botanical/cashew-corner.svg') left -40px top -10px / 220px auto no-repeat, url('images/botanical/cashew-right.svg') right -70px top -20px / 200px auto no-repeat, #fff; }
  .bar { max-width: 820px; margin: 1rem auto 0; display: flex; gap: .6rem; justify-content: flex-end; padding: 0 1rem; }
  .bar button, .bar a { font: inherit; padding: .55rem 1rem; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; text-decoration: none; }
  .bar a { background: #fff; color: var(--ink); }
  .sheet { max-width: 820px; margin: 1rem auto 2rem; background: #fff; padding: 2.2rem; border-radius: 8px; box-shadow: 0 10px 30px rgba(27,14,6,.08); }
  header { display: flex; justify-content: space-between; gap: 1.5rem; border-bottom: 2px solid var(--gold); padding-bottom: 1rem; flex-wrap: wrap; }
  .brand { display: flex; gap: .8rem; align-items: center; }
  .brand img { width: 52px; height: 52px; object-fit: contain; }
  h1 { font: 500 1.6rem 'Playfair Display', Georgia, serif; margin: 0; }
  .muted { color: var(--muted); }
  .doc-title { text-align: right; }
  .doc-title h2 { margin: 0; font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; }
  .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 1.4rem 0; }
  .parties h3 { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .3rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .6rem .5rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .totals { margin-left: auto; width: min(320px, 100%); margin-top: 1rem; }
  .totals div { display: flex; justify-content: space-between; padding: .3rem 0; }
  .totals .grand { border-top: 2px solid var(--ink); font-weight: 600; font-size: 1.05rem; margin-top: .3rem; padding-top: .5rem; }
  footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); white-space: pre-line; }
  .note { background: #f7eed3; padding: .7rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  @media (max-width: 600px) { .sheet { padding: 1.2rem; } .parties { grid-template-columns: 1fr; } .doc-title { text-align: left; } }
  @media (max-width: 720px) { body.arumbu-invoice { background: url('images/botanical/cashew-corner.svg') left -20px top -6px / 130px auto no-repeat, url('images/botanical/cashew-corner-right.svg') right -20px top -6px / 130px auto no-repeat, #fff; } }
  @media print { body { background: #fff; } .bar { display: none; } .sheet { box-shadow: none; margin: 0; max-width: none; padding: 0; } }
</style>
</head>
<body class="arumbu-invoice">
<div class="bar"><a href="account.html#orders" id="invBack">Back</a><button type="button" onclick="window.print()">Print / Save as PDF</button></div>
<main class="sheet" id="inv"><p class="muted">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-public.js"></script>
<script src="js/invoice.js"></script>
</body>
</html>
